services:
  spring-boot:
    build: .
    ports:
      - "8080:8080"
    environment: .env
    restart: unless-stopped
  mysql:
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s 
  redis:
    image: redis:7-alphine
    ports:
      - "6379:6379"
    restart: always

volumes:
  mysql-data: